version: "3.8"

networks:
  homelab-network:
    name: homelab-network
    driver: bridge

services:
  # -------------------------------------------------------------
  # Homepage Dashboard
  # -------------------------------------------------------------
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "30050:3000"
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    networks:
      - homelab-network

  # -------------------------------------------------------------
  # Nextcloud Collaboration Suite
  # -------------------------------------------------------------
  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "30080:80"
    volumes:
      - ${DATA_DIR}/nextcloud/html:/var/www/html
    environment:
      - APACHE_DISABLE_REWRITE_IP=1
      - TRUSTED_PROXIES=127.0.0.1,${SERVER_LAN_IP},${SERVER_TAILSCALE_IP}
    networks:
      - homelab-network

  # -------------------------------------------------------------
  # Paperless-ngx Document Archive
  # -------------------------------------------------------------
  paperless-redis:
    image: redis:7-alpine
    container_name: paperless-redis
    restart: unless-stopped
    networks:
      - homelab-network

  paperless-web:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-web
    restart: unless-stopped
    depends_on:
      - paperless-redis
    ports:
      - "30082:8000"
    volumes:
      - ${DATA_DIR}/paperless/data:/usr/src/paperless/data
      - ${DATA_DIR}/paperless/media:/usr/src/paperless/media
      - ${DATA_DIR}/paperless/export:/usr/src/paperless/export
      - ${DATA_DIR}/paperless/consume:/usr/src/paperless/consume
    environment:
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_TIME_ZONE=${TIMEZONE:-Europe/Rome}
      - PAPERLESS_URL=http://${SERVER_LAN_IP}:30082
      - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
      - PAPERLESS_ALLOWED_HOSTS=*
      - PAPERLESS_CSRF_ALLOWED_HOSTS=http://${SERVER_LAN_IP}:30082,http://${SERVER_TAILSCALE_IP}:30082
    networks:
      - homelab-network

  # -------------------------------------------------------------
  # Firefly III Personal Finance
  # -------------------------------------------------------------
  firefly-db:
    image: mariadb:10.11
    container_name: firefly-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${FIREFLY_DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${FIREFLY_DB_NAME}
      - MYSQL_USER=${FIREFLY_DB_USER}
      - MYSQL_PASSWORD=${FIREFLY_DB_PASSWORD}
    volumes:
      - ${DATA_DIR}/firefly/db_data:/var/lib/mysql
    networks:
      - homelab-network

  firefly-app:
    image: fireflyiii/core:latest
    container_name: firefly-app
    restart: unless-stopped
    depends_on:
      - firefly-db
    ports:
      - "30090:8080"
    volumes:
      - ${DATA_DIR}/firefly/upload:/var/www/html/storage/upload
    environment:
      - APP_KEY=${FIREFLY_APP_KEY}
      - DB_HOST=firefly-db
      - DB_PORT=3306
      - DB_CONNECTION=mysql
      - DB_DATABASE=${FIREFLY_DB_NAME}
      - DB_USERNAME=${FIREFLY_DB_USER}
      - DB_PASSWORD=${FIREFLY_DB_PASSWORD}
      - APP_URL=http://${SERVER_LAN_IP}:30090
      - TZ=${TIMEZONE:-Europe/Rome}
    networks:
      - homelab-network

  firefly-importer:
    image: fireflyiii/data-importer:latest
    container_name: firefly-importer
    restart: unless-stopped
    depends_on:
      - firefly-app
    ports:
      - "30091:8080"
    environment:
      - FIREFLY_III_URL=http://firefly-app:8080
      - VANITY_URL=http://${SERVER_LAN_IP}:30090
      - USE_SUDO=false
    networks:
      - homelab-network

  # -------------------------------------------------------------
  # Monitoring Stack (Prometheus & Grafana)
  # -------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ${DATA_DIR}/monitoring/prometheus_data:/prometheus
    networks:
      - homelab-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "30030:3000"
    volumes:
      - ${DATA_DIR}/monitoring/grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - homelab-network
