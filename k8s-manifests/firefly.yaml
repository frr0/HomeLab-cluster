apiVersion: v1
kind: Service
metadata:
  name: firefly-db
  namespace: homelab
spec:
  ports:
  - port: 3306
    targetPort: 3306
  selector:
    app: firefly-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-db
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefly-db
  template:
    metadata:
      labels:
        app: firefly-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: homelab-secrets
              key: FIREFLY_DB_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          value: firefly
        - name: MYSQL_USER
          value: firefly
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: homelab-secrets
              key: FIREFLY_DB_PASSWORD
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/mysql
      volumes:
      - name: db-data
        hostPath:
          path: /home/server/homelab-storage/firefly/db_data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-app
  namespace: homelab
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30090
  selector:
    app: firefly-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-app
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefly-app
  template:
    metadata:
      labels:
        app: firefly-app
    spec:
      containers:
      - name: firefly-core
        image: fireflyiii/core:latest
        env:
        - name: DB_HOST
          value: firefly-db
        - name: DB_PORT
          value: "3306"
        - name: DB_CONNECTION
          value: mysql
        - name: DB_DATABASE
          value: firefly
        - name: DB_USERNAME
          value: firefly
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: homelab-secrets
              key: FIREFLY_DB_PASSWORD
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: homelab-secrets
              key: FIREFLY_APP_KEY
        - name: APP_URL
          value: http://192.168.1.100:30090
        - name: TZ
          value: Europe/Rome
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: upload
          mountPath: /var/www/html/storage/upload
      volumes:
      - name: upload
        hostPath:
          path: /home/server/homelab-storage/firefly/upload
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-importer
  namespace: homelab
spec:
  type: NodePort
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30091
  selector:
    app: firefly-importer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly-importer
  namespace: homelab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefly-importer
  template:
    metadata:
      labels:
        app: firefly-importer
    spec:
      containers:
      - name: importer
        image: fireflyiii/data-importer:latest
        env:
        - name: FIREFLY_III_URL
          value: http://firefly-app:8080
        - name: VANITY_URL
          value: http://192.168.1.100:30090
        - name: USE_SUDO
          value: "false"
        ports:
        - containerPort: 8080
